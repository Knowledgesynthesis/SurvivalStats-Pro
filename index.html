<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive, evidence-based course in survival analysis: Kaplan–Meier, log-rank, RMST, Cox regression, non-proportional hazards, parametric models, competing risks, landmarking, recurrent events, multi-state models and prediction-model validation." />
    <meta name="theme-color" content="#1a1a19" />
    <title>SurvivalStats Pro — Learn Survival Analysis by Doing</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('theme-storage') || '{}').state
        var dark = t && typeof t.isDarkMode === 'boolean' ? t.isDarkMode : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
